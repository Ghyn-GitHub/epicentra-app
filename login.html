<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acceder | Epicentra</title>
    <link rel="stylesheet" href="./css/login.css" />
    <script>
      const savedTheme = localStorage.getItem("theme");

      if (savedTheme === "dark") {
        document.documentElement.classList.add("dark-mode");
      }
    </script>
    <script type="module" src="./js/auth.js"></script>
  </head>
  <body>
    <header class="main-header">
      <a href="./index.html" class="logo">
        <span class="logo-icon">
          <svg
            viewBox="0 0 40 40"
            width="42"
            height="42"
            xmlns="http://www.w3.org/2000/svg"
          >
            <circle
              cx="20"
              cy="20"
              r="17"
              fill="none"
              stroke="#9ca3af"
              stroke-width="1.5"
            />
            <path
              d="M5 21 H12 L16 12 L22 29 L27 17 L30 21 H35"
              fill="none"
              stroke="#f3f4f6"
              stroke-width="2"
              stroke-linejoin="round"
              stroke-linecap="round"
            />
          </svg>
        </span>

        <span class="logo-content">
          <span class="logo-text">Epicentra</span>
          <span class="logo-subtitle"
            >Explora la actividad sísmica mundial</span
          >
        </span>
      </a>

      <div class="header-controls">
        <button id="theme-toggle" type="button" aria-label="Cambiar tema">
          <span class="theme-toggle-indicator"></span>

          <svg
            class="sun-icon"
            viewBox="0 0 24 24"
            width="16"
            height="16"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2v2 M12 20v2 M4.93 4.93l1.42 1.42
                        M17.65 17.65l1.42 1.42 M2 12h2 M20 12h2
                        M4.93 19.07l1.42-1.42 M17.65 6.35l1.42-1.42"
            />
          </svg>

          <svg
            class="moon-icon"
            viewBox="0 0 24 24"
            width="16"
            height="16"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M20.985 12.486a9 9 0 1 1-9.473-9.472
                        c.405-.022.617.46.402.803a6.5 6.5 0 0 0
                        8.268 8.268c.344-.215.825-.003.803.401"
            />
          </svg>
        </button>
      </div>
    </header>

    <main class="login-container">
      <section class="login-card">
        <h1 id="form-title">Accede a tu cuenta</h1>
        <p id="form-description">Bienvenido de nuevo a Epicentra.</p>

        <form id="auth-form">
          <div class="form-field">
            <label for="email">Correo electrónico</label>
            <input
              type="email"
              id="email"
              name="email"
              autocomplete="email"
              required
            />
          </div>

          <div class="form-field">
            <label for="password">Contraseña</label>
            <input
              type="password"
              id="password"
              name="password"
              autocomplete="current-password"
              required
            />
          </div>

          <p id="auth-message" role="status" aria-live="polite"></p>

          <button type="submit" id="auth-submit">Iniciar sesión</button>
        </form>

        <p class="auth-switch">
          <span id="auth-switch-text">¿No tienes cuenta?</span>
          <button type="button" id="auth-toggle">Crear cuenta</button>
        </p>
      </section>
    </main>
  </body>
</html>
